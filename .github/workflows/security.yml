name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Security / committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: ./scripts/scan-secrets.sh

  dependencies:
    name: Security / dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python environment
        id: python-audit
        continue-on-error: true
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit .
      - name: Audit production Node dependencies
        id: node-audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce dependency audit results
        if: always()
        env:
          PYTHON_AUDIT_OUTCOME: ${{ steps.python-audit.outcome }}
          NODE_AUDIT_OUTCOME: ${{ steps.node-audit.outcome }}
        run: |
          test "$PYTHON_AUDIT_OUTCOME" = success
          test "$NODE_AUDIT_OUTCOME" = success

  dependency-review:
    name: Security / dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high

  sbom:
    name: Supply chain / SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: pvemaster.spdx.json
          upload-artifact: true
          artifact-name: pvemaster-sbom

  containers:
    name: Security / container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: pvemaster-backend:scan
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: pvemaster-frontend:scan
          push: false
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pvemaster-backend:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pvemaster-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
