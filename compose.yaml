name: pvemaster

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pvemaster
      POSTGRES_USER: pvemaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvemaster -d pvemaster"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: PVE Master
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://pvemaster:${POSTGRES_PASSWORD}@postgres:5432/pvemaster
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: '["${FRONTEND_ORIGIN:-http://localhost:3000}"]'
      ADMIN_MFA_REQUIRED: '${ADMIN_MFA_REQUIRED:-false}'
      WEBAUTHN_RP_ID: '${WEBAUTHN_RP_ID:-localhost}'
      WEBAUTHN_RP_NAME: '${WEBAUTHN_RP_NAME:-PVE Master}'
      WEBAUTHN_ORIGIN: '${WEBAUTHN_ORIGIN:-http://localhost:3000}'
      PVE_ALLOWED_HOSTS: '${PVE_ALLOWED_HOSTS:-[]}'
      PVE_ALLOWED_NETWORKS: '${PVE_ALLOWED_NETWORKS:-[]}'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker-operations:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=operations",
        "--hostname=operations@%h",
      ]
    environment:
      APP_NAME: PVE Master Worker
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://pvemaster:${POSTGRES_PASSWORD}@postgres:5432/pvemaster
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: "[]"
      PVE_ALLOWED_HOSTS: '${PVE_ALLOWED_HOSTS:-[]}'
      PVE_ALLOWED_NETWORKS: '${PVE_ALLOWED_NETWORKS:-[]}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker:celery_app inspect ping --destination operations@$$HOSTNAME --timeout 5",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker-inventory:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=inventory",
        "--hostname=inventory@%h",
      ]
    environment:
      APP_NAME: PVE Master Inventory Worker
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://pvemaster:${POSTGRES_PASSWORD}@postgres:5432/pvemaster
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: "[]"
      PVE_ALLOWED_HOSTS: '${PVE_ALLOWED_HOSTS:-[]}'
      PVE_ALLOWED_NETWORKS: '${PVE_ALLOWED_NETWORKS:-[]}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker:celery_app inspect ping --destination inventory@$$HOSTNAME --timeout 5",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker-maintenance:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=maintenance",
        "--hostname=maintenance@%h",
      ]
    environment:
      APP_NAME: PVE Master Maintenance Worker
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://pvemaster:${POSTGRES_PASSWORD}@postgres:5432/pvemaster
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: "[]"
      PVE_ALLOWED_HOSTS: '${PVE_ALLOWED_HOSTS:-[]}'
      PVE_ALLOWED_NETWORKS: '${PVE_ALLOWED_NETWORKS:-[]}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker:celery_app inspect ping --destination maintenance@$$HOSTNAME --timeout 5",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    command:
      [
        "celery",
        "-A",
        "app.worker:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      APP_NAME: PVE Master Scheduler
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      DATABASE_URL: postgresql+asyncpg://pvemaster:${POSTGRES_PASSWORD}@postgres:5432/pvemaster
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: "[]"
      PVE_ALLOWED_HOSTS: '${PVE_ALLOWED_HOSTS:-[]}'
      PVE_ALLOWED_NETWORKS: '${PVE_ALLOWED_NETWORKS:-[]}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_INTERNAL_URL: http://backend:8000
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres_data:
